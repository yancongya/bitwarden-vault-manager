version: "3.9"

services:
  bwvault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bwvault
    ports:
      - "127.0.0.1:3000:3000"    # HTTP (local API proxy + session)
      - "3443:3443"    # HTTPS (Web Crypto enabled — use this for dashboard)
    volumes:
      - bwvault-data:/data
      - ./agent-harness:/app/agent-harness:ro   # live source in dev
    environment:
      - BWVAULT_HOME=/data/session
      - NO_COLOR=
      # Supply the master password via host env for non-interactive runs.
      # WARNING: only use in trusted CI environments; prefer `--password`
      # interactive prompt or piped stdin for production.
      # - BWVAULT_PASSWORD=${BWVAULT_PASSWORD}
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=10M
    restart: "no"

volumes:
  bwvault-data:
    driver: local
